<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spam Mail Detector</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📧 Spam Mail Detector</h1>

    <p>Enter an email message below.</p>

    <form action="/predict" method="POST">

        <textarea
            name="message"
            placeholder="Paste your email here..."
            required>{{ message if message else "" }}</textarea>

        <button type="submit">
            Detect
        </button>

    </form>

    {% if prediction %}
    <div class="result">
        {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
